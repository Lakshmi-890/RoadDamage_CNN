<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="clean-tex" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0.35 0 0 0 0.16  0 0.35 0 0 0.18  0 0 0.35 0 0.22  0 0 0 1 0" />
    </filter>
    <linearGradient id="smooth-asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283244" />
      <stop offset="100%" stop-color="#1d2533" />
    </linearGradient>
  </defs>

  <!-- Intact smooth paved asphalt -->
  <rect width="800" height="600" fill="url(#smooth-asphalt)" />
  <rect width="800" height="600" filter="url(#clean-tex)" opacity="0.25" />

  <!-- Crisp white shoulder lines and clean yellow divider -->
  <line x1="80" y1="0" x2="80" y2="600" stroke="#f1f5f9" stroke-width="6" opacity="0.9" />
  <line x1="720" y1="0" x2="720" y2="600" stroke="#f1f5f9" stroke-width="6" opacity="0.9" />

  <!-- Crisp center dashed lines -->
  <line x1="400" y1="15" x2="400" y2="120" stroke="#facc15" stroke-width="8" stroke-linecap="round" opacity="0.95" />
  <line x1="400" y1="175" x2="400" y2="280" stroke="#facc15" stroke-width="8" stroke-linecap="round" opacity="0.95" />
  <line x1="400" y1="335" x2="400" y2="440" stroke="#facc15" stroke-width="8" stroke-linecap="round" opacity="0.95" />
  <line x1="400" y1="495" x2="400" y2="600" stroke="#facc15" stroke-width="8" stroke-linecap="round" opacity="0.95" />
</svg>
