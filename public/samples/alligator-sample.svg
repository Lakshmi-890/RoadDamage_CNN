<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="asphalt-tex" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.14  0 0.3 0 0 0.16  0 0 0.3 0 0.19  0 0 0 1 0" />
    </filter>
    <linearGradient id="road-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222b3b" />
      <stop offset="100%" stop-color="#18202d" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#road-bg)" />
  <rect width="800" height="600" filter="url(#asphalt-tex)" opacity="0.3" />

  <!-- Road lane divider -->
  <line x1="720" y1="0" x2="720" y2="600" stroke="#facc15" stroke-width="6" opacity="0.7" />
  <line x1="80" y1="0" x2="80" y2="600" stroke="#ffffff" stroke-width="6" opacity="0.6" />

  <!-- Heavy Alligator Crack Matrix (Center region: x:220 to 580, y:140 to 460) -->
  <g stroke="#090c13" stroke-width="3" fill="#141a24" opacity="0.9" stroke-linejoin="round" stroke-linecap="round">
    <!-- Tile mesh mimicking fatigue alligator cracking -->
    <polygon points="260,180 320,170 340,210 290,230 250,210" />
    <polygon points="320,170 380,165 410,200 340,210" />
    <polygon points="380,165 440,175 460,215 410,200" />
    <polygon points="440,175 500,185 520,225 460,215" />

    <polygon points="250,210 290,230 280,280 230,270 220,230" />
    <polygon points="290,230 340,210 360,260 300,285 280,280" />
    <polygon points="340,210 410,200 425,250 360,260" />
    <polygon points="410,200 460,215 475,265 425,250" />
    <polygon points="460,215 520,225 540,275 475,265" />

    <polygon points="230,270 280,280 270,335 220,325 210,290" />
    <polygon points="280,280 300,285 320,345 270,335" />
    <polygon points="300,285 360,260 375,320 320,345" />
    <polygon points="360,260 425,250 435,310 375,320" />
    <polygon points="425,250 475,265 490,325 435,310" />
    <polygon points="475,265 540,275 550,335 490,325" />

    <polygon points="220,325 270,335 260,395 210,380" />
    <polygon points="270,335 320,345 330,405 260,395" />
    <polygon points="320,345 375,320 390,385 330,405" />
    <polygon points="375,320 435,310 445,375 390,385" />
    <polygon points="435,310 490,325 500,390 445,375" />
    <polygon points="490,325 550,335 555,400 500,390" />

    <polygon points="260,395 330,405 320,460 250,445" />
    <polygon points="330,405 390,385 400,450 320,460" />
    <polygon points="390,385 445,375 450,440 400,450" />
    <polygon points="445,375 500,390 495,455 450,440" />

    <!-- Spidering fissures branching outward -->
    <path d="M 220,230 L 170,210 L 140,225" />
    <path d="M 210,380 L 160,395 L 130,380" />
    <path d="M 520,225 L 570,205 L 610,215" />
    <path d="M 555,400 L 600,420 L 635,410" />
    <path d="M 380,165 L 390,120 L 375,90" />
    <path d="M 400,450 L 415,505 L 395,540" />
  </g>
</svg>
